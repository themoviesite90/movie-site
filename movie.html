<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CineBuzz — Watch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

  <!-- CSS later -->
  <link rel="stylesheet" href="movie.css">
</head>
<body>

  <!-- Backdrop -->
  <div id="backdrop" class="backdrop"></div>

  <!-- Main Content -->
  <div class="movie-container">

    <h1 id="movieTitle">Loading...</h1>

    <p class="meta">
      ⭐ Rating: <span id="movieRating">--</span> |
      🎭 Genres: <span id="movieGenres">--</span>
    </p>

    <p id="movieOverview"></p>

    <!-- Buttons -->
    <div class="buttons">
      <button id="watchBtn">▶ Watch Trailer</button>
      <button id="favBtn">❤️ Add to My List</button>
      <button onclick="location.href='index.html'">🏠 Home</button>
    </div>

    <!-- Video Player -->
    <div id="player" class="player"></div>

  </div>

  <!-- Scripts -->
  <script src="auth.js" type="module"></script>
  <script src="movie.js"></script>

</body>
</html>
