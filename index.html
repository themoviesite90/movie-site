<!DOCTYPE html>
<html>
<head>
  <title>CineNova</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
 <header>
  <h2>🎬 CineBuzz</h2>
  <input id="search" placeholder="Search movies...">
  <a href="favorites.html" style="color:white">❤️ My List</a>

  <a id="loginBtn" href="login.html" style="color:white">Login</a>
  <button id="logoutBtn" style="display:none">Logout</button>
</header>
<div class="top-filters">
  <button id="moviesBtn">🎬 Movies</button>
  <button id="tvBtn">📺 TV Series</button>
</div>

<div class="industry-filters">
  <button data-lang="en">🌍 Hollywood</button>
  <button data-lang="hi">🇮🇳 Bollywood</button>
  <button data-lang="te">🇮🇳 Tollywood</button>
  <button data-lang="bn">🇧🇩 Dhallywood</button>
  <button data-lang="ko">🇰🇷 Korean</button>
  <button data-lang="ja">🇯🇵 Anime</button>
</div>
<div id="hero">
  <div class="hero-content">
    <h1 id="heroTitle">Loading...</h1>
    <p id="heroOverview"></p>
    <button id="heroWatch">▶ Watch</button>
</div>


<div class="categories">
  <button data-genre="trending">🔥 Trending</button>
  <button data-genre="28">🎬 Action</button>
  <button data-genre="27">👻 Horror</button>
  <button data-genre="35">😂 Comedy</button>
  <button data-genre="878">🚀 Sci-Fi</button>
  <button data-genre="10749">❤️ Romance</button>
</div>

<div id="movies"></div>

<script src="script.js"></script><script type="module" src="auth.js"></script>

<script type="module">
  const loginBtn = document.getElementById("loginBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  onAuthStateChanged(auth, user => {
    if (user) {
      loginBtn.innerText = user.email;
      loginBtn.href = "#";
      logoutBtn.style.display = "inline-block";
    } else {
      loginBtn.innerText = "Login";
      loginBtn.href = "login.html";
      logoutBtn.style.display = "none";
    }
  });

  logoutBtn.onclick = () => {
    signOut(auth);
  };
</script>

</body>
